[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feecbench"
version = "0.1.0"
description = "FEEC-native PDE benchmark prototype (2D acoustic pilot, gmsh meshing)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "h5py>=3.8",
    "torch>=2.1",
    "matplotlib>=3.7",
    "gmsh>=4.11",
]

[project.optional-dependencies]
surface = [
    "numpy>=1.26,<2; python_version < '3.13'",
    "numpy>=2.0,<2.3; python_version >= '3.13'",
    "pydec @ git+https://github.com/hirani/pydec.git@c181202c70e79794dcc8fa4577537a4eb4987b2a",
    "scikit-image>=0.25",
]
dev = [
    "pytest>=7",
    "ruff>=0.4",
    "jupytext>=1.15",
    "nbconvert>=7",
    "ipykernel",
    "threadpoolctl",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Upstream PyDEC's pinned 1x1 scalar assignment is verified with NumPy <2.3.
    "ignore:Conversion of an array with ndim > 0 to a scalar is deprecated.*:DeprecationWarning:pydec.fem.innerproduct",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"demo/*" = ["E402"]     # BLAS thread caps must be set before numpy is imported
"scripts/*" = ["E402"]
"tests/conftest.py" = ["E402"]
